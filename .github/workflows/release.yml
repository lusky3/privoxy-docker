name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 4.1.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --title "Privoxy ${RELEASE_VERSION}" \
            --notes "## Privoxy Docker ${RELEASE_VERSION}

          Docker images for Privoxy ${RELEASE_VERSION}

          ### Images
          - \`lusky3/privoxy:${RELEASE_VERSION}\`
          - \`lusky3/privoxy:latest\`
          - \`ghcr.io/lusky3/privoxy-docker:${RELEASE_VERSION}\`

          ### Platforms
          - linux/amd64
          - linux/arm64

          ### Usage
          \`\`\`bash
          docker pull lusky3/privoxy:${RELEASE_VERSION}
          docker run -d -p 8118:8118 lusky3/privoxy:${RELEASE_VERSION}
          \`\`\`"

      - name: Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Release Created"
          description: "Privoxy ${{ inputs.version }} release published"
          color: 0x00ff00
          username: GitHub Actions
